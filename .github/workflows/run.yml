name: Run Instagram Reels Bot

on:
  schedule:
    - cron: '0 12 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: استخراج المستودع
        uses: actions/checkout@v3

      - name: إعداد بايثون
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: تثبيت المكتبات والملفات المطلوبة
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: تشغيل سكريبت النشر
        env:
          IG_USERNAME: ${{ secrets.Instagram_USERNAME }}
          IG_PASSWORD: ${{ secrets.Instagram_PASSWORD }}
        run: |
          python main.py
